<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mini App – GitFlow</title>
  <!-- Conectado ao seu arquivo de estilos -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <!-- Título unificado sem duplicidades (resolução do bug visual) -->
    <h1 id="title">Mini App – GitFlow</h1>
  </header>

  <main>
    <section class="card">
      <p id="message">Bem-vindos! Vamos praticar GitFlow.</p>

      <div class="counter">
        <button id="btn-decrement" aria-label="Decrementar">–</button>
        <span id="count" aria-live="polite">0</span>
        <button id="btn-increment" aria-label="Incrementar">+</button>
      </div>

      <div class="theme">
        <button id="btn-toggle-theme" aria-pressed="false">Alternar tema</button>
      </div>
    </section>
  </main>

  <footer>
    <!-- Versão limpa 1.0.0 sem repetição -->
    <small>Equipe kmt • Versão 1.0.0</small>
  </footer>

  <!-- Conectado ao seu app.js -->
  <script src="app.js"></script>
</body>
</html>
